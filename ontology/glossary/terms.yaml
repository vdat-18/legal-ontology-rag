artifact_id: road-traffic-ontology-glossary
artifact_version: "0.2.0"
terms:
  - id: TERM-RULE-001
    label_vi: Quy tắc xử phạt
    definition_vi: >-
      Quy tắc pháp lý theo một phiên bản cụ thể, kết nối hành vi, phạm vi áp dụng,
      điều kiện, ngoại lệ, hậu quả, nguồn và thời gian hiệu lực.
    cq_ids: [CQ-RULE-001, CQ-ASSEMBLY-001]
    boundary: Một mức tiền phạt riêng lẻ chỉ là hậu quả, không phải toàn bộ quy tắc.

  - id: TERM-RULE-002
    label_vi: Phiên bản quy tắc
    definition_vi: Biểu hiện của một quy tắc có nội dung và thời gian hiệu lực xác định.
    cq_ids: [CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    boundary: Hai đoạn văn giống nhau không tự động là hai phiên bản của cùng một quy tắc.

  - id: TERM-CONDUCT-001
    label_vi: Hành vi được điều chỉnh
    definition_vi: Loại hành động, không hành động hoặc cách xử sự được quy tắc pháp luật điều chỉnh.
    cq_ids: [CQ-RULE-001, CQ-COMPARISON-001]
    boundary: Đây là loại hành vi trong quy định, không phải một lần thực hiện cụ thể.

  - id: TERM-CONDUCT-002
    label_vi: Sự kiện hành vi
    definition_vi: Một lần hành vi xảy ra trong bối cảnh có chủ thể, phương tiện và thời điểm cụ thể.
    cq_ids: [CQ-RULE-001, CQ-TEMPORAL-001, CQ-NEGATIVE-001]
    boundary: Nội dung hành vi được viết trong nghị định không phải sự kiện thực tế.

  - id: TERM-APP-001
    label_vi: Hồ sơ áp dụng
    definition_vi: Tổ hợp nhất quán các yêu cầu về loại chủ thể, vai trò, phương tiện và điều kiện của một quy tắc.
    cq_ids: [CQ-APPLICABILITY-001, CQ-CONDITION-001, CQ-NEGATIVE-001]

  - id: TERM-SUBJECT-002
    label_vi: Vai trò chủ thể pháp lý
    definition_vi: Tư cách phụ thuộc ngữ cảnh mà một chủ thể đảm nhận, như người điều khiển hoặc chủ phương tiện.
    cq_ids: [CQ-APPLICABILITY-001, CQ-POINTS-001, CQ-REMEDY-001]
    boundary: Vai trò không đồng nhất với cá nhân hoặc tổ chức đảm nhận vai trò đó.

  - id: TERM-SUBJECT-005
    label_vi: Loại chủ thể
    definition_vi: Phân loại pháp lý của chủ thể, như cá nhân hoặc tổ chức.
    cq_ids: [CQ-APPLICABILITY-001, CQ-COMPARISON-001]
    boundary: Người điều khiển và chủ phương tiện là vai trò, không phải loại chủ thể.

  - id: TERM-SUBJECT-006
    label_vi: Sự gán vai trò
    definition_vi: Quan hệ cho biết một chủ thể đảm nhận vai trò nào trong một sự kiện hành vi cụ thể.
    cq_ids: [CQ-RULE-001, CQ-APPLICABILITY-001, CQ-NEGATIVE-001]

  - id: TERM-VEHICLE-001
    label_vi: Loại phương tiện
    definition_vi: Nhóm phương tiện có ý nghĩa pháp lý làm thay đổi phạm vi áp dụng hoặc hậu quả của quy tắc.
    cq_ids: [CQ-APPLICABILITY-001, CQ-COMPARISON-001, CQ-NEGATIVE-001]

  - id: TERM-COND-001
    label_vi: Điều kiện áp dụng
    definition_vi: Mệnh đề phải có giá trị phù hợp để một quy tắc hoặc hậu quả được áp dụng.
    cq_ids: [CQ-CONDITION-001, CQ-RULE-001]
    boundary: Điều kiện không tự động là ngoại lệ hoặc tình tiết tăng nặng, giảm nhẹ.

  - id: TERM-COND-002
    label_vi: Biểu thức điều kiện
    definition_vi: Cấu trúc bảo toàn quan hệ AND, OR hoặc NOT giữa các điều kiện áp dụng.
    cq_ids: [CQ-CONDITION-001, CQ-NEGATIVE-001]

  - id: TERM-EXCEPTION-001
    label_vi: Ngoại lệ pháp lý
    definition_vi: Trường hợp có nguồn pháp lý loại trừ hoặc chuyển hướng khỏi một quy tắc chung.
    cq_ids: [CQ-EXCEPTION-001]
    boundary: Từ "trừ" trong văn bản không đủ để tự động kết luận đó là ngoại lệ áp dụng.

  - id: TERM-CONSEQUENCE-001
    label_vi: Hậu quả pháp lý
    definition_vi: Hệ quả do quy tắc quy định, như phạt tiền, trừ điểm, xử phạt bổ sung hoặc khắc phục hậu quả.
    cq_ids: [CQ-CONSEQUENCE-001]

  - id: TERM-MONEY-001
    label_vi: Phạt tiền
    definition_vi: Hậu quả pháp lý yêu cầu nộp một số tiền hoặc một giá trị trong khoảng tiền xác định.
    cq_ids: [CQ-PENALTY-001, CQ-CONSEQUENCE-001]

  - id: TERM-POINTS-001
    label_vi: Trừ điểm giấy phép lái xe
    definition_vi: Hậu quả pháp lý làm giảm số điểm của giấy phép lái xe theo giá trị được quy định.
    cq_ids: [CQ-POINTS-001, CQ-CONSEQUENCE-001]

  - id: TERM-ADDITIONAL-001
    label_vi: Hình thức xử phạt bổ sung
    definition_vi: Hình thức xử phạt được nguồn pháp luật phân loại là bổ sung cho xử phạt chính.
    cq_ids: [CQ-ADDITIONAL-001, CQ-CONSEQUENCE-001]

  - id: TERM-REMEDY-001
    label_vi: Biện pháp khắc phục hậu quả
    definition_vi: Nghĩa vụ khôi phục hoặc sửa chữa được nguồn pháp luật phân loại là biện pháp khắc phục hậu quả.
    cq_ids: [CQ-REMEDY-001, CQ-CONSEQUENCE-001]

  - id: TERM-PROVISION-001
    label_vi: Quy định cấu trúc
    definition_vi: Đơn vị có thể định vị trong một biểu hiện văn bản, như điều, khoản hoặc điểm.
    cq_ids: [CQ-SOURCE-001, CQ-ASSEMBLY-001]

  - id: TERM-CITATION-001
    label_vi: Dẫn chiếu điều khoản
    definition_vi: Đối tượng tham chiếu đến một hoặc nhiều quy định cấu trúc.
    cq_ids: [CQ-SOURCE-001, CQ-EXCEPTION-001]
    boundary: Dẫn chiếu và quy định được dẫn chiếu là hai đối tượng khác nhau.

  - id: TERM-TIME-001
    label_vi: Khoảng hiệu lực
    definition_vi: Khoảng thời gian đã được xác minh mà một phiên bản quy tắc có hiệu lực.
    cq_ids: [CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    boundary: Không có ngày kết thúc nghĩa là chưa biết, không tự động nghĩa là vô hạn.

  - id: TERM-CHANGE-004
    label_vi: Thay đổi pháp lý
    definition_vi: Sự kiện có nguồn pháp lý kết nối phiên bản quy tắc trước và phiên bản sau nếu có.
    cq_ids: [CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    boundary: Thứ tự thời gian hoặc độ giống văn bản không tự động chứng minh có sửa đổi, thay thế hoặc bãi bỏ.
