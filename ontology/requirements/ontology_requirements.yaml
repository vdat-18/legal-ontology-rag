schema_version: "0.1.0"
artifact_id: road-traffic-ontology-requirements
artifact_version: "0.1.1"
status: v0.1_frozen
requirement_categories:
  - id: purpose
    requirements:
      - id: PURP-001
        statement: Provide explicit and versioned semantics for Vietnamese road-traffic administrative penalty rules.
      - id: PURP-002
        statement: >-
          Represent enough legal context to distinguish rules that concern similar conduct but differ by subject,
          vehicle, condition, exception, source, or effective time.
      - id: PURP-003
        statement: Make every material assertion traceable to an authoritative provision and exact evidence span.

  - id: intended_use
    requirements:
      - id: USE-001
        statement: Describe a penalty rule as a contextual legal object rather than an unconditional conduct-to-penalty pair.
      - id: USE-002
        statement: >-
          Determine which legal consequences apply when conduct, subject role, vehicle category, conditions, and date
          are known.
      - id: USE-003
        statement: Explain why two similar cases have different consequences.
      - id: USE-004
        statement: Represent amendments and determine which version of a rule is applicable at a specified date.
      - id: USE-005
        statement: >-
          Validate ontology completeness and correctness through executable CQ fixtures in a later formalization phase.

  - id: in_scope
    requirements:
      - id: SCOPE-001
        statement: Legal documents, provisions, citations, chunks, quoted evidence spans, and issuing bodies.
      - id: SCOPE-002
        statement: Regulated conduct and the legal rule that regulates it.
      - id: SCOPE-003
        statement: Legal subjects, contextual subject roles, and vehicle categories.
      - id: SCOPE-004
        statement: Applicability conditions and exceptions.
      - id: SCOPE-005
        statement: >-
          Monetary penalties, driver-license point deductions, additional sanctions, and remedial measures.
      - id: SCOPE-006
        statement: Effective intervals, amendment, replacement, and supersession of rules or provisions.
      - id: SCOPE-007
        statement: >-
          Direct provenance from a modeled rule and consequence to the provisions and evidence that support them.

  - id: required_granularity
    requirements:
      - id: GRAN-001
        statement: A legal rule is distinguishable from the conduct it regulates and the consequence it imposes.
      - id: GRAN-002
        statement: A subject role such as `người điều khiển xe` is distinguishable from a natural or legal person.
      - id: GRAN-003
        statement: Vehicle category is modeled separately when it changes applicability or consequence.
      - id: GRAN-004
        statement: >-
          Conditions and exceptions are first-class candidates because they may have provenance and may alter
          applicability.
      - id: GRAN-005
        statement: >-
          Monetary amount, point deduction, additional sanction, and remedial measure are distinct consequence kinds.
      - id: GRAN-006
        statement: A provision citation and its exact quoted evidence are distinct provenance objects.
      - id: GRAN-007
        statement: Temporal applicability belongs to the rule or legal expression, not to the conduct in the abstract.
      - id: GRAN-008
        statement: The same normalized conduct may participate in multiple rules without forcing those rules to be identical.
