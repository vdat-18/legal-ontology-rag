schema_version: "0.1.0"
artifact_id: legal-ontology-rag-internal-legal-review
artifact_version: "0.1.0"
status: project_owner_approved_for_v0.1_freeze
title: AI-Assisted Internal Legal Review for Road Traffic Legal Ontology V0.1
reviewer_requirements:
  role: Codex internal Vietnamese legal-domain and ontology reviewer
  qualifications:
    - Review Vietnamese road-traffic administrative sanction semantics against repository evidence.
    - Keep legal interpretation, ontology structure, and automated inference boundaries explicit.
    - Do not represent this AI-assisted review as licensed legal-professional certification.
review_policy:
  allowed_decisions: [accept, reject, change_requested, pending]
  all_item_acceptance_required_for_recommendation: true
  llm_may_prepare_summary: true
  codex_may_record_internal_review_decisions: true
  project_owner_final_acceptance_required: true
  external_reviewer_required: false
source_registries:
  requirements: ontology/requirements/ontology_requirements.yaml
  competency_questions: ontology/requirements/competency_questions.yaml
  glossary: ontology/glossary/terms.yaml
  modeling_decisions: ontology/decisions/modeling_decisions.yaml
review_items:
  - id: ILR-001
    title: Rule and legal-expression identity
    pending_topics: [legal_identity, legal_expression_identity]
    question: Are version-specific penalty rules, legal resources, and legal expressions distinguished correctly?
    affected_ids: [MD-RULE-001, MD-DOC-001, TERM-RULE-001, TERM-RULE-002]
    evidence_files: [ontology/modules/normative_rule.ttl, ontology/modules/source_provenance.ttl]
    acceptance_criteria:
      - Similar wording alone never establishes identity across legal instruments or versions.
      - Each accepted rule identity is grounded in an authoritative expression and provision.
  - id: ILR-002
    title: Conduct normalization boundary
    pending_topics: [conduct_normalization]
    question: Does the model correctly separate regulated conduct concepts, rule specifications, and concrete occurrences?
    affected_ids: [MD-CONDUCT-001, TERM-CONDUCT-001, TERM-CONDUCT-002, TERM-APP-001]
    evidence_files: [ontology/modules/occurrence_context.ttl, ontology/modules/normative_rule.ttl]
    acceptance_criteria:
      - Normalized conduct does not erase legally material actor, vehicle, condition, or source differences.
      - Conduct similarity does not establish rule identity or applicability.
  - id: ILR-003
    title: Legal subject and contextual role taxonomy
    pending_topics: [legal_taxonomy]
    question: Are subject kinds, legal subjects, contextual roles, and role assignments legally distinguished?
    affected_ids: [MD-SUBJECT-001, TERM-SUBJECT-002, TERM-SUBJECT-005, TERM-SUBJECT-006]
    evidence_files: [ontology/modules/occurrence_context.ttl, ontology/modules/normative_rule.ttl]
    acceptance_criteria:
      - Driver, owner, custodian, and operator roles are not inferred from one another.
      - Individual and organization values are not confused with contextual legal roles.
  - id: ILR-004
    title: Vehicle legal taxonomy
    pending_topics: [vehicle_taxonomy]
    question: Are vehicle categories represented at the distinctions required by the reviewed penalty provisions?
    affected_ids: [MD-VEHICLE-001, TERM-VEHICLE-001]
    evidence_files: [ontology/modules/occurrence_context.ttl, ontology/shapes/legal_ontology.shacl.ttl]
    acceptance_criteria:
      - Vehicle categories preserve every distinction that changes applicability or consequence.
      - SKOS hierarchy does not silently become an OWL subclass or legal subsumption conclusion.
  - id: ILR-005
    title: Condition expression grouping
    pending_topics: [legal_expression_grouping]
    question: Do condition trees preserve conjunction, alternatives, negation, and legal scope without evaluating them?
    affected_ids: [MD-COND-001, TERM-COND-001, TERM-COND-002]
    evidence_files: [ontology/modules/normative_rule.ttl, ontology/shapes/legal_ontology.shacl.ttl]
    acceptance_criteria:
      - Grouping matches the authoritative syntax and provision hierarchy.
      - The ontology records conditions but does not claim their truth for an occurrence.
  - id: ILR-006
    title: Exception scope, citation grouping, and legal priority
    pending_topics: [legal_priority]
    question: Are exceptions, grouped citations, excluded provisions, and redirects modeled without deciding legal priority automatically?
    affected_ids: [MD-EXCEPTION-001, MD-REF-001, TERM-EXCEPTION-001, TERM-CITATION-001, TERM-PROVISION-001]
    evidence_files: [ontology/modules/normative_rule.ttl, ontology/tests/cq_queries/cq_exception_001.rq]
    acceptance_criteria:
      - Citation grouping and source provenance are preserved.
      - Redirects target reviewed version-specific rules and do not automate legal priority.
  - id: ILR-007
    title: Legal consequence classification
    pending_topics: [legal_classification]
    question: Are monetary penalties, point deductions, additional sanctions, and remedial measures classified correctly?
    affected_ids: [MD-CONSEQUENCE-001, MD-CONSEQUENCE-002, TERM-CONSEQUENCE-001, TERM-MONEY-001, TERM-POINTS-001, TERM-ADDITIONAL-001, TERM-REMEDY-001]
    evidence_files: [ontology/modules/legal_consequence.ttl, ontology/tests/cq_queries/cq_consequence_001.rq]
    acceptance_criteria:
      - Every subtype is supported by normative source text, not a form or attachment alone.
      - Missing consequence data remains unknown and is not interpreted as zero or legal absence.
  - id: ILR-008
    title: Normative document and attachment legal status
    pending_topics: [legal_status]
    question: Does the model avoid treating files, attachments, or forms as normative provisions without legal authority?
    affected_ids: [MD-DOC-002]
    evidence_files: [ontology/modules/source_provenance.ttl, ontology/tests/cq_queries/cq_source_001.rq]
    acceptance_criteria:
      - File containment does not establish normative status.
      - Provision status and governing expression remain independently evidenced.
  - id: ILR-009
    title: Effective dates and legal change types
    pending_topics: [legal_effective_date, legal_change_type]
    question: Are validity intervals and amendment, replacement, repeal, or supersession events legally supported?
    affected_ids: [MD-TIME-001, MD-CHANGE-001, TERM-TIME-001, TERM-CHANGE-004]
    evidence_files: [ontology/modules/temporal_change.ttl, ontology/tests/cq_queries/cq_temporal_002_change_projection.rq]
    acceptance_criteria:
      - Effective dates are supported at rule level by authoritative evidence.
      - Missing interval ends remain unknown and change types are never inferred from textual similarity.
  - id: ILR-010
    title: Source provenance boundary
    pending_topics: []
    question: Is every material legal assertion traceable to an authoritative provision and source chunk?
    affected_ids: [MD-PROV-001, MD-PROV-002, TERM-PROVISION-001, TERM-CITATION-001]
    evidence_files: [ontology/modules/source_provenance.ttl, ontology/tests/cq_queries/cq_source_001.rq]
    acceptance_criteria:
      - Provenance for one component does not silently support unrelated components.
      - Heading-derived scope retains both ancestor and leaf provision provenance.
  - id: ILR-011
    title: V0.1 scope, competency questions, and legal limitations
    pending_topics: []
    question: Are the V0.1 scope, exclusions, CQs, and stated limitations legally appropriate and non-misleading?
    affected_ids: [PURP-001, USE-001, SCOPE-001, GRAN-001, CQ-RULE-001, CQ-TEMPORAL-001, CQ-EXCEPTION-001]
    evidence_files: [ontology/requirements/ontology_requirements.yaml, ontology/requirements/competency_questions.yaml, ontology/reports/v0.1_qa_report.md]
    acceptance_criteria:
      - Structural CQ projections are not represented as final legal conclusions.
      - Out-of-scope procedure, appeals, civil/criminal liability, and sanction aggregation remain explicit.
