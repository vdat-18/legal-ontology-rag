artifact_id: road-traffic-ontology-modeling-decisions
artifact_version: "0.1.0"
status: v0.1_frozen
source_plan: docs/ontology_construction_plan.md
approval:
  project_owner_status: accepted
  accepted_items: [LR-001, LR-002, LR-003, LR-004, LR-005, LR-006, LR-007]
  accepted_on: "2026-08-17"
  independent_legal_professional_review: not_asserted
  ai_assisted_internal_legal_review: approved
  project_owner_v0.1_acceptance: user-confirmed:2026-08-18:ILR-001-through-ILR-011
modeling_decisions:
  - id: MD-RULE-001
    version: "0.1.0"
    decision: >-
      Treat each `PenaltyRule` as a version-specific normative object grounded in one legal expression and one or more
      provisions. Link earlier/later rules explicitly; do not create an enduring cross-version rule identity
      automatically.
    rationale: Avoids unsupported identity across amendments while still answering historical comparison CQs.
    review_status: ontology_reviewed
    cq_ids: [CQ-RULE-001, CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    pilot_evidence: >-
      Explicit NĐ 168 to NĐ 238 amendment; rejected NĐ 168/NĐ 336 identity assumption.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_identity]

  - id: MD-RULE-002
    version: "0.1.0"
    decision: Model `PenaltyRule` as a reified entity following an n-ary relation pattern.
    rationale: Conditions, exceptions, consequences, time, and provenance need attachment points.
    review_status: ontology_reviewed
    cq_ids: [CQ-RULE-001, CQ-ASSEMBLY-001]
    pilot_evidence: No-plate rule requires separately sourced applicability and consequences.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []

  - id: MD-CONDUCT-001
    version: "0.1.0"
    decision: Separate reusable `RegulatedConduct` concepts from concrete `ConductOccurrence` events.
    rationale: >-
      The legal text describes conduct types, while applicability questions concern events with actors, vehicles,
      context, and dates.
    review_status: ontology_reviewed
    cq_ids: [CQ-RULE-001, CQ-COMPARISON-001]
    pilot_evidence: >-
      Similar right-side-passing wording must not collapse rule specifications or concrete occurrences.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [conduct_normalization]

  - id: MD-SUBJECT-001
    version: "0.1.0"
    decision: >-
      Separate `LegalSubject`, controlled `SubjectKind`, `LegalSubjectRole`, and contextual `RoleAssignment`; do not
      also formalize natural person and organization as pilot subject subclasses.
    rationale: >-
      Keeps natural person and organization usable as applicability values without OWL metamodeling, while driver,
      owner, and custodian remain contextual roles.
    review_status: revised_and_ontology_reviewed
    cq_ids: [CQ-APPLICABILITY-001, CQ-POINTS-001, CQ-NEGATIVE-001]
    pilot_evidence: >-
      Driver, owner, and vehicle operator are roles; individual and organization are subject kinds.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_taxonomy]

  - id: MD-VEHICLE-001
    version: "0.1.0"
    decision: >-
      Represent vehicle categories as SKOS-aligned controlled concepts; classify a concrete vehicle through a category
      relation.
    rationale: Avoids using OWL classes as property values and supports multilingual/legal taxonomy maintenance.
    review_status: ontology_reviewed
    cq_ids: [CQ-APPLICABILITY-001, CQ-COMPARISON-001, CQ-NEGATIVE-001]
    pilot_evidence: >-
      Motorcycle and primitive-vehicle rules share conduct wording but differ by vehicle category.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [vehicle_taxonomy]

  - id: MD-COND-001
    version: "0.1.0"
    decision: >-
      Preserve conditions as an expression tree of atomic conditions and `AllOf`/`AnyOf`/`Not` groups, plus exact
      source text.
    rationale: Retains conjunction, alternatives, negation, and scope without introducing a rule engine.
    review_status: ontology_reviewed
    cq_ids: [CQ-CONDITION-001, CQ-POINTS-001]
    pilot_evidence: >-
      Article 12 point deduction adds a vehicle-operator condition outside the monetary clause.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_expression_grouping]

  - id: MD-EXCEPTION-001
    version: "0.1.0"
    decision: >-
      Model an exception as an explicit entity targeting a general rule, optionally citing excluded provisions and
      redirecting to assembled specific rule versions.
    rationale: >-
      Article 6(1)(a) cites 30 locators resolving to 32 targets; a negative condition or direct rule edge cannot
      preserve citation grouping, provenance, target versioning, or legal priority.
    review_status: revised_and_ontology_reviewed
    cq_ids: [CQ-EXCEPTION-001]
    pilot_evidence: >-
      Article 6(1)(a) has one evidenced exception statement with 30 cited locators and 32 targets.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_priority]

  - id: MD-REF-001
    version: "0.1.0"
    decision: >-
      Keep a provision citation distinct from the cited provision and from any assembled target rule; resolve target
      rule versions using their validity intervals.
    rationale: >-
      Article 6(1)(a) remains textually stable while three cited targets receive later expressions under NĐ 238.
    review_status: ontology_reviewed
    cq_ids: [CQ-EXCEPTION-001, CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    pilot_evidence: >-
      Three cited Article 6 targets receive later versions while the exception wording remains unchanged.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []

  - id: MD-CONSEQUENCE-001
    version: "0.1.0"
    decision: >-
      Model consequences as entities; use qualified value objects for monetary ranges and explicit targets/responsible
      roles.
    rationale: Preserves consequence kind, value, affected object, provenance, and independent lifecycle.
    review_status: ontology_reviewed
    cq_ids: [CQ-PENALTY-001, CQ-CONSEQUENCE-001, CQ-POINTS-001, CQ-ADDITIONAL-001, CQ-REMEDY-001]
    pilot_evidence: >-
      No-plate and plate-compliance fixtures require distinct consequence kinds, values, and targets.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []

  - id: MD-CONSEQUENCE-002
    version: "0.1.0"
    decision: Assign a consequence subtype only when the normative source supports that legal classification.
    rationale: >-
      The rejected NĐ 118 candidate came from an attached form and could not establish `RemedialMeasure`
      classification.
    review_status: ontology_reviewed
    cq_ids: [CQ-CONSEQUENCE-001, CQ-REMEDY-001]
    pilot_evidence: NĐ 118 attached form is insufficient to prove remedial-measure classification.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_classification]

  - id: MD-PROV-001
    version: "0.1.0"
    decision: Attach evidence to each material rule component rather than only to the whole rule.
    rationale: >-
      The penalty amount, point deduction, condition, and additional sanction may be stated in different provisions.
    review_status: ontology_reviewed
    cq_ids: [CQ-SOURCE-001, CQ-EVIDENCE-001, CQ-ASSEMBLY-001]
    pilot_evidence: Money, points, confiscation, and remedies are supported by different clauses.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []

  - id: MD-PROV-002
    version: "0.1.0"
    decision: >-
      Preserve the full structural provision path and ground heading-derived applicability in the relevant ancestor
      provision as well as the leaf provision.
    rationale: Several extracted records omitted article headings that supplied subject-role and vehicle scope.
    review_status: ontology_reviewed
    cq_ids: [CQ-APPLICABILITY-001, CQ-SOURCE-001, CQ-ASSEMBLY-001]
    pilot_evidence: >-
      Article headings recover subject and vehicle scope omitted by several extracted provision paths.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []

  - id: MD-DOC-001
    version: "0.1.0"
    decision: >-
      Use an ELI-aligned three-layer distinction: legal resource/work, legal expression, and source file/format;
      provisions belong to an expression.
    rationale: >-
      Distinguishes legal identity, amended/consolidated text, and downloaded files without importing all of ELI.
    review_status: ontology_reviewed
    cq_ids: [CQ-SOURCE-001, CQ-TEMPORAL-002]
    pilot_evidence: >-
      Legal resource, expression, downloaded DOCX, and embedded attachment have different identities.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_expression_identity]

  - id: MD-DOC-002
    version: "0.1.0"
    decision: >-
      Do not classify attachment or form content as a normative `LegalProvision` unless its legal status and governing
      provision are established.
    rationale: >-
      Source-file containment alone did not make the NĐ 118 form text an authoritative remedial rule.
    review_status: ontology_reviewed
    cq_ids: [CQ-EVIDENCE-001, CQ-REMEDY-001, CQ-SOURCE-001]
    pilot_evidence: Embedded form content must not become a normative provision through file containment alone.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_status]

  - id: MD-TIME-001
    version: "0.1.0"
    decision: >-
      Give each approved rule one verified OWL-Time-aligned validity interval; an absent end is unknown unless
      authoritative evidence establishes an end.
    rationale: >-
      Prevents document-level dates or nullable extraction fields from becoming unsupported rule-level conclusions.
    review_status: revised_and_ontology_reviewed
    cq_ids: [CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    pilot_evidence: >-
      NĐ 168 and NĐ 238 effective dates are evidenced; nullable extraction fields are not legal conclusions.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_effective_date]

  - id: MD-CHANGE-001
    version: "0.1.0"
    decision: >-
      Represent amendment, replacement, and repeal as typed `LegalChange` events connecting earlier and optional later
      rule versions.
    rationale: Change has its own source, effective date, and type; a direct generic edge would lose that context.
    review_status: ontology_reviewed
    cq_ids: [CQ-TEMPORAL-001, CQ-TEMPORAL-002]
    pilot_evidence: >-
      NĐ 238 provides an explicit amendment event; NĐ 336 similarity provides no such event.
    stakeholder_approval: accepted_for_v0.1
    pending_review: []
    resolved_review: [legal_change_type]
