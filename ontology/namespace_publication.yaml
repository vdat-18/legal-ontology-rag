publication_boundaries:
  - Canonical paths may move to a later approved release; version paths remain immutable.
  - HTML requests resolve to human-readable landing pages and Turtle requests resolve to exact source bytes.
  - W3ID rules must not be submitted until every publication target is deployed and externally verified.
  - Fragment identifiers are resolved by clients after the ontology document is retrieved.
  - Namespace resolution approval requires the W3ID pull request to be merged; local readiness alone is insufficient.
