release_boundaries:
  - A release is created only from a passing semantic-QA report for the same ontology version.
  - License, external-reuse, and project-owner model approvals remain explicit fail-closed gates.
  - Project-owner model approval requires a complete AI-assisted internal review for all ILR items.
  - The source inventory is explicit; runtime data, generated populations, and GraphRAG artifacts are excluded.
  - Namespace publication and W3ID registration are optional post-freeze workflows outside this internal archive.
  - Archive entry ordering, timestamps, permissions, and JSON serialization are normalized for reproducible packaging.
  - The checksum authenticates the complete archive but does not provide a digital signature or legal certification.
