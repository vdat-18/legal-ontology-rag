schema_version: "0.1.0"
artifact_id: legal-ontology-rag-external-reuse-registry
artifact_version: "0.2.0"
review:
  project_owner_approval: approved
scope:
  formal_artifacts:
    - ontology/legal_ontology.ttl
    - ontology/modules/source_provenance.ttl
    - ontology/modules/occurrence_context.ttl
    - ontology/modules/temporal_change.ttl
    - ontology/modules/normative_rule.ttl
    - ontology/modules/legal_consequence.ttl
    - ontology/shapes/legal_ontology.shacl.ttl
  foundational_namespaces:
    - http://www.w3.org/1999/02/22-rdf-syntax-ns#
    - http://www.w3.org/2000/01/rdf-schema#
    - http://www.w3.org/2002/07/owl#
    - http://www.w3.org/2001/XMLSchema#
    - http://www.w3.org/ns/shacl#
resources:
  - id: REUSE-DCTERMS-001
    resource: DCMI Metadata Terms
    authority: Dublin Core Metadata Initiative
    source_version: namespace snapshot reviewed 2026-08-18
    source_url: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/
    namespace: http://purl.org/dc/terms/
    license: CC-BY-4.0
    attribution: Dublin Core Metadata Initiative, DCMI Metadata Terms
    decision: reuse
    policy_mode: term_iri_reference
    formal_use: active_terms
    owl_import: false
    review_status: ontology_reviewed
    compatibility: Metadata annotations do not impose domain identity or legal-rule semantics.
    boundaries:
      - Use terms only for ontology metadata, source references, dates, and licensing.
      - Do not infer legal authority from dcterms:source alone.
    terms:
      - iri: http://purl.org/dc/terms/description
        local_use: Human-readable ontology and module descriptions.
        declaration_in_owl_closure: true
      - iri: http://purl.org/dc/terms/issued
        local_use: Versioned ontology artifact issue date.
        declaration_in_owl_closure: true
      - iri: http://purl.org/dc/terms/license
        local_use: Root ontology CC BY 4.0 license link.
        declaration_in_owl_closure: true
      - iri: http://purl.org/dc/terms/source
        local_use: Construction-plan source reference for formal artifacts.
        declaration_in_owl_closure: true
      - iri: http://purl.org/dc/terms/title
        local_use: Multilingual ontology and module titles.
        declaration_in_owl_closure: true

  - id: REUSE-PROV-001
    resource: PROV-O
    authority: World Wide Web Consortium
    source_version: W3C Recommendation 2013-04-30
    source_url: https://www.w3.org/TR/2013/REC-prov-o-20130430/
    namespace: http://www.w3.org/ns/prov#
    license: W3C-20150513
    attribution: W3C Provenance Working Group, PROV-O
    decision: reuse
    policy_mode: term_iri_reference
    formal_use: active_terms
    owl_import: false
    review_status: ontology_reviewed
    compatibility: Entity, Agent, and derivation semantics fit the local source-provenance boundary.
    boundaries:
      - Legal provisions, source chunks, and modeled assertions remain local extensions.
      - No complete PROV-O import or activity model is required.
    terms:
      - iri: http://www.w3.org/ns/prov#Agent
        local_use: Superclass for reviewed source and processing agents.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/ns/prov#Entity
        local_use: Superclass for legal resources, expressions, files, chunks, and assertions.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/ns/prov#wasDerivedFrom
        local_use: Superproperty for explicit source derivation.
        declaration_in_owl_closure: true

  - id: REUSE-SKOS-001
    resource: SKOS Simple Knowledge Organization System
    authority: World Wide Web Consortium
    source_version: W3C Recommendation 2009-08-18
    source_url: https://www.w3.org/TR/2009/REC-skos-reference-20090818/
    namespace: http://www.w3.org/2004/02/skos/core#
    license: W3C-20150513
    attribution: W3C Semantic Web Deployment Working Group, SKOS Reference
    decision: reuse
    policy_mode: term_iri_reference
    formal_use: active_terms
    owl_import: false
    review_status: ontology_reviewed
    compatibility: SKOS supports controlled multilingual concepts without treating values as OWL classes.
    boundaries:
      - SKOS broader relations never become OWL subclass axioms automatically.
      - Concept similarity or mapping does not establish legal-rule identity.
    terms:
      - iri: http://www.w3.org/2004/02/skos/core#Concept
        local_use: Superclass for controlled conduct, role, vehicle, change-type, and currency concepts.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#ConceptScheme
        local_use: Type for local controlled vocabulary schemes.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#broader
        local_use: SHACL-controlled reviewed concept hierarchy relation.
        declaration_in_owl_closure: false
      - iri: http://www.w3.org/2004/02/skos/core#definition
        local_use: Human-readable controlled concept definitions.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#hasTopConcept
        local_use: Scheme-to-top-concept membership.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#inScheme
        local_use: Controlled concept scheme membership.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#notation
        local_use: Stable controlled notation such as VND.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#prefLabel
        local_use: Preferred multilingual controlled concept labels.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2004/02/skos/core#topConceptOf
        local_use: Top-concept-to-scheme membership.
        declaration_in_owl_closure: true

  - id: REUSE-TIME-001
    resource: Time Ontology in OWL
    authority: World Wide Web Consortium
    source_version: W3C Recommendation 2020-03-26
    source_url: https://www.w3.org/TR/2020/CR-owl-time-20200326/
    namespace: http://www.w3.org/2006/time#
    license: W3C-20150513
    attribution: W3C Spatial Data on the Web Working Group, OWL-Time
    decision: reuse
    policy_mode: term_iri_reference
    formal_use: active_terms
    owl_import: false
    review_status: ontology_reviewed
    compatibility: Generic instants and intervals fit temporal carriers while legal validity remains local.
    boundaries:
      - OWL-Time relations do not decide legal effectiveness or applicability.
      - Missing interval ends remain unknown rather than infinite.
    terms:
      - iri: http://www.w3.org/2006/time#Instant
        local_use: Type for occurrence, boundary, and legal-change instants.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2006/time#Interval
        local_use: Superclass for local legal validity intervals.
        declaration_in_owl_closure: true
      - iri: http://www.w3.org/2006/time#hasBeginning
        local_use: SHACL-validated interval beginning relation.
        declaration_in_owl_closure: false
      - iri: http://www.w3.org/2006/time#hasEnd
        local_use: SHACL-validated interval end relation.
        declaration_in_owl_closure: false
      - iri: http://www.w3.org/2006/time#inXSDDateTime
        local_use: SHACL-supported instant timestamp representation.
        declaration_in_owl_closure: false
      - iri: http://www.w3.org/2006/time#inXSDDateTimeStamp
        local_use: Preferred timestamp representation for concrete occurrence instants.
        declaration_in_owl_closure: false
