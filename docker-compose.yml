# Neo4j backend for Graphiti. Reads NEO4J_USER/NEO4J_PASSWORD from .env
# (defaults below match src/legal_rag/config.py). Start with:
#   docker compose up -d
services:
  neo4j:
    image: neo4j:5.26
    container_name: legal-rag-neo4j
    ports:
      - "7474:7474" # HTTP browser (http://localhost:7474)
      - "7687:7687" # Bolt (driver connection)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
