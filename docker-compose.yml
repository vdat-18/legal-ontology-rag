x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

services:
  neo4j:
    profiles: [neo4j]
    image: neo4j:5.26
    container_name: legal-rag-neo4j
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${INFRA_HOST_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?Set NEO4J_USER}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  etcd:
    profiles: [milvus, attu]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: legal-rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio:
    profiles: [milvus, attu]
    image: cgr.dev/chainguard/minio:latest-dev@sha256:8d5a0265f0e18fb3b29f95598147f1cc2a86b782181668bad176b0e90cce9569
    container_name: legal-rag-minio
    # The previous upstream image ran as root, so existing named volumes can be root-owned.
    user: "0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: ["server", "/minio_data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  milvus:
    profiles: [milvus, attu]
    image: milvusdb/milvus:v2.4.15
    container_name: legal-rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:?Set MILVUS_ROOT_PASSWORD}
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MILVUS_GRPC_PORT:-19530}:19530"
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  attu:
    profiles: [attu]
    image: zilliz/attu:v2.4.3
    container_name: legal-rag-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${ATTU_PORT:-3000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-app
    init: true
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: ${MILVUS_TOKEN:?Set MILVUS_TOKEN}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY}
    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "legal_rag.naive_rag_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    logging: *default-logging

  redis:
    profiles: [redis, app]
    image: redis:7-alpine
    container_name: legal-rag-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  huggingface_cache:
  redis_data:
