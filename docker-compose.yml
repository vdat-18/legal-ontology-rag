x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-3}

services:
  neo4j:
    profiles: [graphiti]
    image: neo4j:5.26
    container_name: legal-rag-neo4j
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${INFRA_HOST_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?Set NEO4J_USER}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  etcd:
    profiles: [naive-rag, attu]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: legal-rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio:
    profiles: [naive-rag, attu]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: legal-rag-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  milvus:
    profiles: [naive-rag, attu]
    image: milvusdb/milvus:v2.4.15
    container_name: legal-rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:?Set MILVUS_ROOT_PASSWORD}
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MILVUS_GRPC_PORT:-19530}:19530"
      - "${INFRA_HOST_BIND:-127.0.0.1}:${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  attu:
    profiles: [attu]
    image: zilliz/attu:v2.4.3
    container_name: legal-rag-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${INFRA_HOST_BIND:-127.0.0.1}:${ATTU_PORT:-3000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-app
    init: true
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NAIVE_RAG_MILVUS_URI: http://milvus:19530
      NAIVE_RAG_MILVUS_TOKEN: ${NAIVE_RAG_MILVUS_TOKEN:?Set NAIVE_RAG_MILVUS_TOKEN}
    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    logging: *default-logging

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  huggingface_cache:
