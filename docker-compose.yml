# Neo4j backend for Graphiti + Milvus vector store (with etcd/MinIO deps).
# Reads NEO4J_USER/NEO4J_PASSWORD/MINIO_ROOT_USER/MINIO_ROOT_PASSWORD from .env
# (defaults below match src/legal_rag/config.py). Start with:
#   docker compose up -d
services:
  neo4j:
    image: neo4j:5.26
    container_name: legal-rag-neo4j
    ports:
      - "7474:7474" # HTTP browser (http://localhost:7474)
      - "7687:7687" # Bolt (driver connection)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Milvus standalone requires etcd (metadata) and MinIO (object storage).
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: legal-rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: legal-rag-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001" # MinIO console (http://localhost:9001)
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: legal-rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    ports:
      - "19530:19530" # Milvus gRPC (driver connection)
      - "9091:9091" # Milvus HTTP (metrics/health)
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # Attu: official Milvus web admin UI (http://localhost:3000).
  attu:
    image: zilliz/attu:v2.4.3
    container_name: legal-rag-attu
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    restart: unless-stopped

  # Runs the CLIs in [project.scripts]; not a long-running service, invoke via
  # `docker compose run --rm app <command> <args>`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-app
    env_file:
      - .env
    environment:
      # Overrides the host-oriented MILVUS_URI in .env: inside the compose
      # network "localhost" is the app container itself, not the milvus one.
      - MILVUS_URI=http://milvus:19530
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - milvus

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  huggingface_cache:
