[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Temporal Ontology-Enhanced RAG for time-aware traffic-violation penalty retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baml-py==0.223.0",
    "defusedxml==0.7.1",
    "fastapi>=0.116",
    "graphiti-core[anthropic]>=0.29",
    "loguru>=0.7",
    "olefile==0.47",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "transformers==5.14.1",
]

[project.optional-dependencies]
vietnamese = []
evaluation = ["deepeval==4.1.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "redis>=5.0"]
dev = [
    "pyshacl>=0.30,<0.31",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "rdflib>=7.1,<8",
    "ruff==0.15.21",
]
naive-rag = ["pymilvus>=3.0", "milvus-lite>=2.4", "sentence-transformers>=3.0"]
corrective-rag = [
    "httpx>=0.27",
    "pymilvus>=3.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.37",
    "torch>=2.1",
    "uvicorn>=0.30",
]

[project.scripts]
legal-parse = "legal_rag.cli:main"
legal-chunk = "legal_rag.chunk_cli:main"
legal-evaluate = "legal_rag.evaluation.cli:main"
legal-crag-api = "legal_rag.corrective_rag.api.server:main"
legal-screen-chunks = "legal_rag.chunk_screening_cli:main"
legal-resolve-document-metadata = "legal_rag.document_metadata_cli:main"
legal-extract-facts = "legal_rag.fact_extraction_cli:main"
legal-backfill-extraction-progress = "legal_rag.extraction_progress_backfill_cli:main"
legal-migrate-legal-facts = "legal_rag.legal_fact_migration_cli:main"
legal-rebind-fact-evidence = "legal_rag.fact_evidence_rebinding_cli:main"
legal-build-evidence-graph = "legal_rag.evidence_graph_cli:main"
legal-build-assembly-candidates = "legal_rag.ontology_assembly_candidates_cli:main"
legal-propose-rule-assemblies = "legal_rag.ontology_assembly_proposals_cli:main"
legal-finalize-rule-assemblies = "legal_rag.ontology_assembly_finalize_cli:main"
legal-build-change-candidates = "legal_rag.ontology_change_candidates_cli:main"
legal-propose-legal-changes = "legal_rag.ontology_change_proposals_cli:main"
legal-finalize-legal-changes = "legal_rag.ontology_change_finalize_cli:main"
legal-build-exception-candidates = "legal_rag.ontology_exception_candidates_cli:main"
legal-propose-legal-exceptions = "legal_rag.ontology_exception_proposals_cli:main"
legal-finalize-legal-exceptions = "legal_rag.ontology_exception_finalize_cli:main"
legal-build-concept-candidates = "legal_rag.ontology_concept_candidates_cli:main"
legal-propose-concept-relations = "legal_rag.ontology_concept_proposals_cli:main"
legal-finalize-concept-resolution = "legal_rag.ontology_concept_finalize_cli:main"
legal-validate-ontology-semantics = "legal_rag.ontology_semantic_qa_cli:main"
legal-package-ontology-release = "legal_rag.ontology_release_cli:main"
legal-build-ontology-publication = "legal_rag.ontology_publication_cli:main"
legal-verify-ontology-publication = "legal_rag.ontology_publication_verification_cli:main"
legal-review-ontology-reuse = "legal_rag.ontology_reuse_review_cli:main"
legal-review-ontology-internally = "legal_rag.ontology_legal_review_cli:main"
legal-check-ontology-population = "legal_rag.ontology_population_preflight_cli:main"
legal-populate-ontology = "legal_rag.ontology_population_cli:main"
legal-generate-candidates = "legal_rag.candidate_generation_cli:main"
legal-export-groundtruth = "legal_rag.groundtruth_export_cli:main"
legal-assemble-groundtruth = "legal_rag.groundtruth_assembly_cli:main"
legal-naive-rag-index = "legal_rag.naive_rag_index_cli:main"
legal-naive-rag-query = "legal_rag.naive_rag_query_cli:main"
legal-graphiti-index = "legal_rag.graphiti_index_cli:main"
legal-graphiti-query = "legal_rag.graphiti_query_cli:main"
legal-graphiti-api = "legal_rag.graphiti_rag.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 120
# Without this, first-party detection depends on the working directory, so import order can be
# reported differently from a clean checkout than from an installed one.
src = ["src", "."]
extend-exclude = [".agents", "data", "src/legal_rag/baml_client"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "ERA",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
cache_dir = ".pytest_cache_local"
