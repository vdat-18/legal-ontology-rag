[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Temporal Ontology-Enhanced RAG for time-aware traffic-violation penalty retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "baml-py==0.223.0",
    "defusedxml==0.7.1",
    "fastapi>=0.116",
    "graphiti-core[anthropic]>=0.29",
    "loguru>=0.7",
    "olefile==0.47",
    "python-dotenv>=1.0",
    "transformers==5.14.1",
]

[project.optional-dependencies]
vietnamese = ["sentence-transformers>=3.0"]
evaluation = ["deepeval==4.1.1", "rank-bm25>=0.2.2", "rapidfuzz>=3.0", "sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "redis>=5.0"]
dev = ["ruff==0.15.21", "pytest>=8.0"]
naive-rag = ["pymilvus>=3.0", "milvus-lite>=2.4", "sentence-transformers>=3.0"]
ragas-eval = ["ragas>=0.2", "langchain-openai>=0.2", "langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
corrective-rag = [
    "httpx>=0.27",
    "pymilvus>=3.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.37",
    "torch>=2.1",
    "uvicorn>=0.30",
]

[project.scripts]
legal-parse = "legal_rag.cli:main"
legal-chunk = "legal_rag.chunk_cli:main"
legal-evaluate = "legal_rag.evaluation.cli:main"
legal-crag-api = "legal_rag.corrective_rag.api.server:main"
legal-screen-chunks = "legal_rag.chunk_screening_cli:main"
legal-resolve-document-metadata = "legal_rag.document_metadata_cli:main"
legal-extract-facts = "legal_rag.fact_extraction_cli:main"
legal-backfill-extraction-progress = "legal_rag.extraction_progress_backfill_cli:main"
legal-migrate-legal-facts = "legal_rag.legal_fact_migration_cli:main"
legal-build-evidence-graph = "legal_rag.evidence_graph_cli:main"
legal-generate-candidates = "legal_rag.candidate_generation_cli:main"
legal-assemble-groundtruth = "legal_rag.groundtruth_assembly_cli:main"
legal-naive-rag-index = "legal_rag.naive_rag_index_cli:main"
legal-naive-rag-query = "legal_rag.naive_rag_query_cli:main"
legal-graphiti-index = "legal_rag.graphiti_index_cli:main"
legal-graphiti-query = "legal_rag.graphiti_query_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 120
extend-exclude = [".agents", "data", "src/legal_rag/baml_client"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "ERA",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
cache_dir = ".pytest_cache_local"
