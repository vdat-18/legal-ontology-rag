[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Temporal Ontology-Enhanced RAG for time-aware traffic-violation penalty retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling==2.114.0",
    "graphiti-core[anthropic]>=0.29",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vietnamese = ["sentence-transformers>=3.0"]
openai = ["openai>=1.30"]
evaluation = ["deepeval==4.1.1", "langchain-community==0.3.31", "langchain-openai==1.3.5", "ragas==0.4.3"]
dev = ["ruff==0.15.21", "pytest>=8.0"]

[project.scripts]
legal-rag = "legal_rag.cli:main"
legal-groundtruth = "legal_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 120
extend-exclude = [".agents", "data"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "ERA",
    "F",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
